<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Network Malware Scanner</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/scan.css">
  <link rel="stylesheet" href="css/slider.css">
  <link rel="stylesheet" href="css/results.css">
  <link rel="stylesheet" href="css/history.css">
</head>
<body>
<header>
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
    <span>Network Malware Scanner</span>
  </div>
  <nav>
    <a href="#scan" id="n-scan">Scan</a>
    <a href="#history" id="n-history">Results</a>
  </nav>
</header>
<main>
  <section class="view" id="v-scan">
    <p class="tag">Scan network traffic for malicious activity</p>
    <div class="ring">
      <svg viewBox="0 0 220 220">
        <defs><linearGradient id="g"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs>
        <circle class="track" cx="110" cy="110" r="100"/>
        <circle id="bar" cx="110" cy="110" r="100"/>
      </svg>
      <button id="go">SCAN</button>
    </div>
    <div class="slider">
      <label><span>Data to scan</span><b id="amt"></b></label>
      <input type="range" id="rng">
      <div class="ends"><span id="min-label"></span><span id="max-label"></span></div>
    </div>
    <p class="err" id="err" hidden></p>
    <div class="stats" id="stats" hidden></div>
  </section>
  <section class="view" id="v-history">
    <h2 style="margin:0">Previous scans</h2>
    <div id="hist"></div>
  </section>
</main>
<script src="js/config.js"></script>
<script src="js/router.js"></script>
<script src="js/api.js"></script>
<script src="js/slider.js"></script>
<script src="js/results.js"></script>
<script src="js/history.js"></script>
<script src="js/scan.js"></script>
<script src="js/main.js"></script>
</body>
</html>
